<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220">
  <!-- Fundo branco retangular com bordas arredondadas -->
  <rect width="640" height="220" rx="44" ry="44" fill="#ffffff"/>
  <!-- Borda sutil para definição -->
  <rect width="640" height="220" rx="44" ry="44" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="3"/>
  <!-- Texto BEMIÊ grande e legível, centralizado -->
  <text
    x="320"
    y="158"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="148"
    font-weight="700"
    fill="#7b5238"
    text-anchor="middle"
    letter-spacing="6"
  >BEMIÊ</text>
</svg>
