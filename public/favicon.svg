<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- Fundo branco quadrado/levemente retangular com bordas arredondadas -->
  <rect width="260" height="220" rx="40" ry="40" fill="#ffffff"/>
  <rect width="260" height="220" rx="40" ry="40" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="3"/>
  <!-- Bê grande e centralizado — legível mesmo em 16x16 -->
  <text
    x="130"
    y="172"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="170"
    font-weight="700"
    fill="#7b5238"
    text-anchor="middle"
    letter-spacing="1"
  >Bê</text>
</svg>
